<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walkura - Register</title>
  <link rel="stylesheet" href="register.css">
  <!-- meka trrhama validation tika hoda idea ekk ganim script gana i mean java script methana ghala thiynne scritp code tikk -->
</head>
<body>
  <nav class="navbar">
    <a href="walkura.html">
      <img src="walkuralogo.png" alt="Walkura Logo" class="logo">
    </a>
  </nav>

  <section class="register-container">
    <h2>Create Your Walkura Account</h2>
    <form id="registerForm">
      <label for="fullname">Full Name:</label>
      <input type="text" id="fullname" placeholder="Enter your full name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" placeholder="Enter your email" required>

      <label for="password">Password:</label>
      <input type="password" id="password" placeholder="Enter a strong password" required>

      <label for="confirmPassword">Confirm Password:</label>
      <input type="password" id="confirmPassword" placeholder="Confirm your password" required>

      <button type="submit">Register</button>
  <p class="login-link">Already have an account? <a href="login.html">Login here</a></p>
    </form>
  </section>

  <footer>
     <p>© 2025 Walkura. All rights Reserved</p>
  </footer>

  <script>
    // Registration validation logic
    document.getElementById("registerForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const name = document.getElementById("fullname").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const confirmPassword = document.getElementById("confirmPassword").value.trim();
      if(password !== confirmPassword) {
        alert("Passwords do not match. Please try again.");
        return;
      }
      if(name && email && password) {
        alert("Registration successful! Redirecting to login...");
        window.location.href = "#login.html";
      } else {
        alert("Please fill in all fields.");
      }
    });
  </script>
</body>
</html>
</html>
