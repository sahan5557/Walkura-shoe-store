<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login to Walkura</title>
  <link rel="stylesheet" href="login.css">
  <!-- meka trrhama validation tika hoda idea ekk ganim script gana i mean java script methana ghala thiynne scritp code tikk -->
</head>
<body>
  <div class="login-bg">
    <div class="login-card">
      <h2>Login to Walkura</h2>
      <form id="loginForm">
        <label for="email"><b>Email</b></label>
        <input type="email" id="email" placeholder="Enter your email" required>
        <label for="password"><b>Password</b></label>
        <input type="password" id="password" placeholder="Enter your password" required>
        <button type="submit" class="login-btn">Login</button>
        <p class="register-link">Don't have an account? <a href="register.html">Register here</a></p>
      </form>
    </div>
  </div>
  <script>
    // Login validation logic
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();
      let email = document.getElementById("email").value;
      let password = document.getElementById("password").value;
      if (email === "johndoe@gmail.com" && password === "12345") {
        alert("Login successful! Redirecting...");
        window.location.href = "walkura.html";
      } else {
        alert("Invalid email or password. Please try again.");
      }
    });
  </script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('backgroundl.png') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .login-bg {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
    }
    .login-card {
      background: rgba(255,255,255,0.98);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      padding: 36px 32px 28px 32px;
      width: 100%;
      max-width: 350px;
      text-align: center;
      margin: 0 auto;
    }
    .login-card h2 {
      font-size: 1.7rem;
      font-weight: 700;
      margin-bottom: 24px;
      color: #222;
    }
    .login-card label {
      display: block;
      margin: 16px 0 6px;
      font-weight: 600;
      color: #444;
      text-align: left;
    }
    .login-card input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
      margin-bottom: 8px;
      font-size: 1rem;
      background: #f7f7f7;
      transition: border 0.2s;
    }
    .login-card input:focus {
      border: 1.5px solid #ff9800;
      outline: none;
    }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg,#ff9800,#ffb74d);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: background 0.2s;
    }
    .login-btn:hover {
      background: linear-gradient(90deg,#ffb74d,#ff9800);
    }
    .register-link {
      margin-top: 18px;
      font-size: 0.98rem;
      color: #555;
    }
    .register-link a {
      color: #ff9800;
      text-decoration: none;
      font-weight: 600;
      transition: text-decoration 0.2s;
    }
    .register-link a:hover {
      text-decoration: underline;
    }
  </style>
</body>
</body>
</html>
